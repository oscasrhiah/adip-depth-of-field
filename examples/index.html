<header><h1>照片景深與短片生成</h1><p>ADIP 課程專案的歷史示範：比較原圖、自動模式與多框選模式，並觀看原作業留下的 5 秒短片。</p><p class="note">這些是既有成果，未保證由目前程式版本逐像素重現。框選邊緣及分割仍有瑕疵。</p></header>
<section aria-labelledby="single-title"><h2 id="single-title">單物件 · 燈塔</h2><div class="grid">

<figure><figcaption>自動模式</figcaption><a href="single/auto.jpg"><img src="single/auto.jpg" alt="燈塔的自動景深處理結果"></a></figure>
